# Copy to .github/workflows/ only after the trusted base contains github-artifacts.
# This example analyzes BlastRadius itself; it installs only the trusted base tool.
name: BlastRadius PR artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted tool source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-tool
          persist-credentials: false
      - name: Check out target objects without executing target code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install trusted tool only
        run: python -m pip install -c trusted-tool/requirements-dev.lock ./trusted-tool
      - name: Analyze event commits
        run: >-
          blastradius github-artifacts --repo target --event "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/blastradius-artifacts"
      - name: Retain reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blastradius-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blastradius-artifacts/
          if-no-files-found: error
          retention-days: 14
